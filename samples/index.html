<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
/* The two viewer pages (index.html and compare_companies.html) share this style, so they look like one tool.
   Idea: as little as possible around the page being shown.  A slim top bar, one row of choices, then the page fills the window. */
:root { --ink: #1d2733; --muted: #5d6b7a; --paper: #ffffff; --page: #f3f5f7; --line: #d5dce3; --accent: #0f6b5c; --accent-soft: #e3f1ee; --off: #8a97a4; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--page); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
[hidden] { display: none !important; }

/* ---------- top bar: the name of the page, and the one big button ---------- */
.topbar { background: var(--accent); color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 20px; }
.topbar h1 { margin: 0; font-size: 1.15rem; line-height: 1.3; }
.topbar .grow { flex: 1 1 auto; }
.cta, .back { color: #fff; text-decoration: none; white-space: nowrap; border-radius: 999px; }
.cta { background: #fff; color: var(--accent); font-weight: 700; padding: 8px 18px; }
.cta:hover { background: var(--accent-soft); }
.back { padding: 6px 14px; border: 1px solid rgba(255, 255, 255, 0.6); font-size: 0.92rem; }
.back:hover { background: rgba(255, 255, 255, 0.15); }
.topbar a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* ---------- the choices: one row on a computer ---------- */
.pickbar { background: var(--paper); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; }
.who { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > label, .field > .label { font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); min-width: 0; max-width: 100%; }
select:focus-visible, button:focus-visible, a.open:focus-visible { outline: 3px solid #8cc7bb; outline-offset: 1px; }
.field.company select { min-width: 280px; }
.vs { padding-bottom: 8px; color: var(--muted); font-weight: 600; }
.end { margin-left: auto; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; }
a.open { color: var(--accent); text-decoration: none; padding: 7px 0; white-space: nowrap; }
a.open:hover { text-decoration: underline; }

/* the three things you can show for a company: joined buttons, the chosen one filled in */
.seg { display: inline-flex; border: 1px solid var(--accent); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; padding: 7px 14px; border: 0; border-right: 1px solid var(--accent); background: #fff; color: var(--accent); cursor: pointer; white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button:hover:not(:disabled) { background: var(--accent-soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:disabled { background: var(--page); color: var(--off); cursor: not-allowed; }

/* ---------- the page being shown fills what is left of the window ---------- */
#viewer { flex: 1 1 auto; display: block; width: 100%; min-height: 480px; border: 0; background: #fff; }

/* ---------- without a script ---------- */
.nojs { margin: 16px 20px; background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 8px; padding: 12px 16px; }
.nojs h2 { margin: 0 0 6px; font-size: 1.05rem; }
.nojs ul { margin: 4px 0 10px; padding-left: 20px; }

@media (max-width: 720px) {
  .topbar, .pickbar { padding-left: 12px; padding-right: 12px; }
  .topbar h1 { font-size: 1rem; }
  .who, .field, .field.company select, .end, .seg { width: 100%; }
  .field.company select { min-width: 0; }
  .who.one-company { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; }      /* company and year share a row, the three views get their own */
  .who.one-company .field.views { grid-column: 1 / -1; }
  a.open { display: none; }                                                                             /* a convenience for a big screen */
  .seg button { flex: 1 1 0; padding-left: 6px; padding-right: 6px; white-space: normal; }
  .vs { display: none; }
  .end { margin-left: 0; }
  #viewer { min-height: 70vh; }
}</style>

ary": "WIPRO_summary_2025-26"}], "trends": [{"id": "WIPRO_trend_2023-24_to_2025-26", "first": "2023-24", "last": "2025-26"}]}], "others": ["error_Reliance_2019-20", "error_Reliance_2021-22", "error_Tata_Steel_2021-22", "error_Reliance_2025-26_to_2021-22", "error_Infosys_2021-22", "error_Xyzzy_Quux_2023-24"]}</script>
<script>
(function () {
  "use strict";
  // ---- shared by index.html and compare_companies.html: finding things, filling a dropdown, showing a page in the frame
  function $(id) { return document.getElementById(id); }

  function find(list, test) { return list.filter(test)[0]; }

  function fromHash() {
    try { return decodeURIComponent(location.hash.slice(1)); } catch (error) { return ""; }
  }

  function setOptions(select, items) {
    var keep = select.value;
    select.textContent = "";
    items.forEach(function (item) {
      var option = document.createElement("option");
      option.value = item.value;
      option.textContent = item.text;
      select.appendChild(option);
    });
    if (items.some(function (item) { return item.value === keep; })) { select.value = keep; }
  }

  // A page shown through srcdoc takes the address of the viewer, so a link such as href="#dash-energy" would try to load the viewer itself
  // into the frame (and fail). <base href="about:srcdoc"> makes such a link jump inside the page. Only the frame gets it, not "Open in a new tab".
  function forFrame(page) {
    return page.replace(/<head[^>]*>/i, function (tag) { return tag + '<base href="about:srcdoc">'; });
  }

  function makeViewer(entries) {
    var frame = $("viewer");
    var openTab = $("open-tab");
    var byId = {};
    var current = null;
    entries.forEach(function (entry) { byId[entry.id] = entry; });
    openTab.addEventListener("click", function (event) {
      if (!current) { event.preventDefault(); return; }
      openTab.href = typeof current.html === "string"
        ? URL.createObjectURL(new Blob([current.html], { type: "text/html" }))
        : encodeURI(current.file);
    });
    return {
      byId: byId,
      show: function (id) {
        var entry = byId[id];
        if (!entry) { return null; }
        current = entry;
        if (typeof entry.html === "string") {
          frame.srcdoc = forFrame(entry.html);
        } else {
          frame.removeAttribute("srcdoc");
          frame.src = encodeURI(entry.file);
        }
        document.title = entry.label;
        try { history.replaceState(null, "", "#" + encodeURIComponent(id)); } catch (error) { /* the page still works without a saved address */ }
        return entry;
      }
    };
  }
  var data = JSON.parse($("hub-data").textContent);
  var viewer = makeViewer(data.entries);
  var companies = data.companies;
  var pickCompany = $("company");
  var pickYear = $("year");
  var other = $("other");                       // the error pages and anything else that belongs to no company (null when there are none)
  var buttons = [].slice.call(document.querySelectorAll(".seg button"));
  var state = { symbol: "", fy: "", view: "report" };
  var place = {};                               // where each page sits: its company, and whether it is a report, a summary or a trend

  companies.forEach(function (company) {
    company.years.forEach(function (year) {
      if (year.report) { place[year.report] = { symbol: company.symbol, fy: year.fy, view: "report" }; }
      if (year.summary) { place[year.summary] = { symbol: company.symbol, fy: year.fy, view: "summary" }; }
    });
    company.trends.forEach(function (trend) { place[trend.id] = { symbol: company.symbol, fy: "", view: "trend" }; });
  });

  // the page for a company, a year and one of the three views ("" when there is none)
  function pageFor(company, fy, view) {
    var year = find(company.years, function (y) { return y.fy === fy; }) || {};
    if (view === "report") { return year.report || ""; }
    if (view === "summary") { return year.summary || ""; }
    var covering = find(company.trends, function (t) { return t.first <= fy && fy <= t.last; });     // the newest trend that covers this year, else the newest
    return (covering || company.trends[0] || {}).id || "";
  }

  // show a company: `fy` and `view` are wishes; a year or view that company has no page for gives way to one it has
  function choose(symbol, fy, view, exact) {
    var company = find(companies, function (c) { return c.symbol === symbol; });
    var years = company.years.map(function (y) { return { value: y.fy, text: "FY " + y.fy }; });
    var wanted = fy || state.fy;
    setOptions(pickYear, years);
    if (years.some(function (y) { return y.value === wanted; })) { pickYear.value = wanted; }
    fy = pickYear.value;                        // "" for a company that has no yearly page
    var chosen = find([view, "report", "summary", "trend"], function (v) { return pageFor(company, fy, v); }) || "report";
    buttons.forEach(function (button) {
      var has = pageFor(company, fy, button.dataset.view) !== "";
      button.disabled = !has;
      button.title = has ? button.dataset.hint : "Not made yet. To make it, run:  python " + button.dataset.make.replace("{name}", '"' + company.name + '"').replace("{fy}", fy);
      button.setAttribute("aria-pressed", String(button.dataset.view === chosen));
    });
    pickCompany.value = symbol;
    if (other) { other.selectedIndex = 0; }
    state = { symbol: symbol, fy: fy, view: chosen };
    viewer.show(exact || pageFor(company, fy, chosen));
  }

  function showOther(id) {
    buttons.forEach(function (button) { button.setAttribute("aria-pressed", "false"); });
    other.value = id;
    viewer.show(id);
  }

  function openPage(id) {
    if (place[id]) { choose(place[id].symbol, place[id].fy, place[id].view, id); return true; }
    if (other && viewer.byId[id]) { showOther(id); return true; }
    return false;
  }

  pickCompany.addEventListener("change", function () { choose(pickCompany.value, "", state.view); });
  pickYear.addEventListener("change", function () { choose(pickCompany.value, pickYear.value, state.view); });
  buttons.forEach(function (button) {
    button.addEventListener("click", function () { choose(state.symbol, state.fy, button.dataset.view); });
  });
  if (other) {
    other.addEventListener("change", function () { if (other.value) { showOther(other.value); } });
    setOptions(other, [{ value: "", text: "Choose a page…" }].concat(data.others.map(function (id) { return { value: id, text: viewer.byId[id].label }; })));
  }
  window.addEventListener("hashchange", function () { openPage(fromHash()); });

  setOptions(pickCompany, companies.map(function (company) { return { value: company.symbol, text: company.name }; }));
  $("who").hidden = companies.length === 0;
  if (!openPage(fromHash())) {
    if (companies.length) { choose(companies[0].symbol, "", "report"); } else if (data.others.length) { showOther(data.others[0]); }
  }
})();
</script>
