[pytest]
# Where our tests live. The folders inside mirror the packages in brsr_p6/ (tests/views tests brsr_p6/views, and so on).
testpaths = tests
# Two folders go on Python's import path:
#   .              the project root, so tests can do `from brsr_p6.views.dashboard_view import ...`
#   tests/helpers  the shared test helpers (blank_report, FakeNse, assert_well_formed ...), so any test can import them by name.
pythonpath = . tests/helpers
